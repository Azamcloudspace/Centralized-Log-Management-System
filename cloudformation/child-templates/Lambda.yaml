AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  OpenSearchDomain:
    Type: String
  OpenSearchEndpoint:
    Type: String
  LambdaLogGroup:
    Type: String

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: FirehoseTransformLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaTransformCloudwatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:PutLogEvents
                  - logs:CreateLogStream
                  - logs:CreateLogGroup
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LambdaLogGroup}"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LambdaLogGroup}:*"

  FirehoseTransformLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: FirehoseTransformLambda
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref LambdaLogGroup
      Environment:
      Code:
        ZipFile: |
          import json
          import urllib.request
          import base64
          import os
          import cfnresponse

          def handler(event, context):
            if event['RequestType'] == 'Delete':
              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              return
            try:
              endpoint = os.environ['OPENSEARCH_ENDPOINT']
              username = os.environ['OPENSEARCH_USERNAME']
              password = os.environ['OPENSEARCH_PASSWORD']
              lambda_role_arn = os.environ['LAMBDA_ROLE_ARN']
              azam_user_arn = os.environ['AZAM_USER_ARN']
              credentials = base64.b64encode(
                f"{username}:{password}".encode()
              ).decode()
              payload = json.dumps({
                "backend_roles": [lambda_role_arn],
                "users": [azam_user_arn]
              }).encode()
              url = f"https://{endpoint}/_plugins/_security/api/rolesmapping/all_access"
              req = urllib.request.Request(
                url,
                data=payload,
                headers={
                  'Content-Type': 'application/json',
                  'Authorization': f'Basic {credentials}'
                },
                method='PUT'
              )
              with urllib.request.urlopen(req) as response:
                result = json.loads(response.read())
                print(f"Security mapping result: {result}")
              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
            except Exception as e:
              print(f"Error: {str(e)}")
              cfnresponse.send(event, context, cfnresponse.FAILED, {})

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FirehoseTransformLambdaFunction
      Action: lambda:InvokeFunction
      Principal: firehose.amazonaws.com
      SourceArn: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${EnvironmentName}-Notification-Event"

Outputs:
  LambdaExecutionRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
  FirehoseTransformLambdaFunctionName:
    Value: !Ref FirehoseTransformLambdaFunction
    FirehoseTransformLambdaFunctionArn:
    Value: !GetAtt FirehoseTransformLambdaFunction.Arn


