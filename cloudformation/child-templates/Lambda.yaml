AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  LambdaLogGroup:
    Type: String
  FirehoseArn:
    Type: String
Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TransformLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LogstoFire
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource:
                  - !Ref FirehoseArn
                  - !Sub "${FirehoseArn}/*"
              - Effect: Allow
                Action:
                  - "logs:PutLogEvents"
                  - "logs:CreateLogStream"
                  - "logs:CreateLogGroup"
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LambdaLogGroup}"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LambdaLogGroup}:*"



      
  TransformLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TransformLambda
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import base64

          def handler(event, context):
              output = []

              for record in event['records']:
                  raw = base64.b64decode(record['data']).decode('utf-8').strip()
                  try:
                      # Parse your app.log format: "timestamp - LEVEL - message"
                      parts = raw.split(" - ", 2)
                      log_json = {
                          "timestamp": parts[0],
                          "level": parts[1],
                          "message": parts[2]
                      }
                  except Exception:
                      log_json = {"message": raw}

                  transformed = json.dumps(log_json) + "\n"

                  output.append({
                      'recordId': record['recordId'],
                      'result': 'Ok',
                      'data': base64.b64encode(transformed.encode('utf-8')).decode('utf-8')
                  })

              return {'records': output}
              
  LogSubscriptionFilter:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      LogGroupName: !Ref ApplicationLogGroup
      FilterPattern: ""
      DestinationArn: !Ref TransformLambdaFunction

Outputs:
  LambdaExecutionRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
  FirehoseTransformLambdaFunctionName:
    Value: !Ref FirehoseTransformLambdaFunction
  FirehoseTransformLambdaFunctionArn:
    Value: !GetAtt FirehoseTransformLambdaFunction.Arn

