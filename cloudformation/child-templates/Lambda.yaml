AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  LambdaLogGroup:
    Type: String
  FirehoseArn:
    Type: String
  ApplicationLogGroupName:
    Type: String
  FirehoseStreamName:
    Type: String

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TransformLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LogstoFire
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource:
                  - !Ref FirehoseArn
                  - !Sub "${FirehoseArn}/*"
              - Effect: Allow
                Action:
                  - "logs:PutLogEvents"
                  - "logs:CreateLogStream"
                  - "logs:CreateLogGroup"
                Resource: "*"

  TransformLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TransformLambda
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30      
      Environment:
        Variables:
          DELIVERY_STREAM: !Ref FirehoseStreamName

      Code:
        ZipFile: |
          import json
          import gzip
          import base64
          import boto3
          import os

          firehose = boto3.client('firehose')

          def handler(event, context):
              DELIVERY_STREAM = os.environ['DELIVERY_STREAM']

              compressed_payload = base64.b64decode(event['awslogs']['data'])
              uncompressed_payload = gzip.decompress(compressed_payload)
              logs_data = json.loads(uncompressed_payload)

              records = []

              for log_event in logs_data['logEvents']:
                  message = log_event['message']

                  records.append({
                      'Data': json.dumps({
                          'message': message,
                          'timestamp': log_event['timestamp']
                      }) + "\n"
                  })

              if records:
                  firehose.put_record_batch(
                      DeliveryStreamName=DELIVERY_STREAM,
                      Records=records
                  )

              return {"status": "ok"}

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TransformLambdaFunction
      Action: lambda:InvokeFunction
      Principal: logs.amazonaws.com
      SourceArn: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ApplicationLogGroupName}:*"

  LogSubscriptionFilter:
    DependsOn: LambdaInvokePermission
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      LogGroupName: !Ref ApplicationLogGroupName
      FilterPattern: ""
      DestinationArn: !GetAtt TransformLambdaFunction.Arn

Outputs:
  LambdaExecutionRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
  TransformLambdaFunctionName:
    Value: !Ref TransformLambdaFunction
  TransformLambdaFunctionArn:
    Value: !GetAtt TransformLambdaFunction.Arn

