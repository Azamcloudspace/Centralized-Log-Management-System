AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  OpenSearchLogGroup:
    Type: String

Resources:

  OpenSearchAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OpenSearchAdminRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:user/AZAM"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OpenSearchFullAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - "es:*"
                Resource: "*"

  OpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: log-domain
      EngineVersion: OpenSearch_2.11
      ClusterConfig:
        InstanceType: t3.small.search
        InstanceCount: 1
        
      LogPublishingOptions:
        ES_APPLICATION_LOGS:
          CloudWatchLogsLogGroupArn: !Ref OpenSearchLogGroup
          Enabled: true

      EBSOptions:
        EBSEnabled: true
        VolumeSize: 10

      NodeToNodeEncryptionOptions:
        Enabled: true

      EncryptionAtRestOptions:
        Enabled: true

      DomainEndpointOptions:
        EnforceHTTPS: true

      AdvancedSecurityOptions:
        Enabled: true
        InternalUserDatabaseEnabled: true
        MasterUserOptions:
          MasterUserARN: !GetAtt OpenSearchAdminRole.Arn

      AccessPolicies:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action:
              - "es:*"
            Resource: 
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/log-domain"
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/log-domain/*"
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:user/AZAM"
            Action:
              - "es:*"
            Resource: 
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/log-domain"
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/log-domain/*"
          - Effect: Allow
            Principal: "*"
            Action:
              - "es:ESHttpGet"
              - "es:ESHttpPost"
              - "es:ESHttpPut"
              - "es:ESHttpDelete"
            Resource: 
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/log-domain"
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/log-domain/*"
            Condition:
              IpAddress: 
                aws:SourceIp: "41.76.192.17/32"
Outputs:
  OpenSearchDomainEndpoint:
    Value: !GetAtt OpenSearchDomain.DomainEndpoint

  OpenSearchDomainArn:
    Value: !GetAtt OpenSearchDomain.Arn

  OpenSearchDomainName:
    Value: !Ref OpenSearchDomain









