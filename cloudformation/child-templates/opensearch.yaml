AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  OpenSearchLogGroup:
    Type: String
  FirehoseLogGroup:
    Type: String
    
Resources:

  OpenSearchFirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OpenSearchFirehoseRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FirehoseToOpenSearchPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - "es:*"
                Resource: 
                  - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/log-domain"
                  - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/log-domain/*"

              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:PutLogEvents"
                  - "logs:CreateLogStream"
                Resource: 
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${FirehoseLogGroup}"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${FirehoseLogGroup}:*"

  OpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: log-domain
      EngineVersion: OpenSearch_2.19
      ClusterConfig:
        InstanceType: t3.medium.search
        InstanceCount: 1
        
      LogPublishingOptions:
        ES_APPLICATION_LOGS:
          CloudWatchLogsLogGroupArn: !Ref OpenSearchLogGroup
          Enabled: true

      EBSOptions:
        EBSEnabled: true
        VolumeSize: 10

      NodeToNodeEncryptionOptions:
        Enabled: true

      EncryptionAtRestOptions:
        Enabled: true

      DomainEndpointOptions:
        EnforceHTTPS: true

      AdvancedSecurityOptions:
        Enabled: true
        InternalUserDatabaseEnabled: true
        MasterUserOptions:
          MasterUserName: "{{resolve:ssm:/OpenSearch/Username}}"
          MasterUserPassword: "{{resolve:ssm:/OpenSearch/Password}}"

      AccessPolicies:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt OpenSearchFirehoseRole.Arn
            Action:
              - "es:*"
            Resource: 
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/log-domain"
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/log-domain/*"
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:user/azamcloudspace"
            Action:
              - "es:*"
            Resource: 
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/log-domain"
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/log-domain/*"
          - Effect: Allow
            Principal: "*"
            Action:
              - "es:*"
            Resource: 
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/log-domain"
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/log-domain/*"
            Condition:
              IpAddress: 
                aws:SourceIp: "197.210.29.246/32"
Outputs:
  OpenSearchDomainEndpoint:
    Value: !GetAtt OpenSearchDomain.DomainEndpoint

  OpenSearchDomainArn:
    Value: !GetAtt OpenSearchDomain.Arn

  OpenSearchDomainName:
    Value: !Ref OpenSearchDomain

  OpenSearchFirehoseRoleArn:
    Value: !GetAtt OpenSearchFirehoseRole.Arn









